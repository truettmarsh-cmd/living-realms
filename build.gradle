plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file(project.findProperty('runDir') ?: 'run')
            property 'forge.logging.console.level', 'info'
            // Some pack mods only pass DistExecutor's dev-time referent check in production mode.
            if (project.hasProperty('packMods')) property 'production', 'true'
            args '--mixin', 'livingrealms.mixins.json'
            // Recruits ships mixins with SRG refmaps
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('cityPlanningTour')) property 'livingrealms.cityPlanningTour', 'true'
            // ./gradlew runClient -Ptour : automated test run with screenshots (see DevTour)
            if (project.hasProperty('castleUiTest')) property 'livingrealms.castleUiTest', 'true'
            if (project.hasProperty('militaryUiTest')) property 'livingrealms.militaryUiTest', 'true'
            // ./gradlew runClient -PrecruitUiTest -PrunDir=run-recruit-ui : Recruit Command screenshots (see RecruitUiTour)
            if (project.hasProperty('recruitUiTest')) property 'livingrealms.recruitUiTest', 'true'
            if (project.hasProperty('realmsUiTest')) property 'livingrealms.realmsUiTest', 'true'
            if (project.hasProperty('guideTest')) property 'livingrealms.guideTest', 'true'
            if (project.hasProperty('honoursUiTest')) property 'livingrealms.honoursUiTest', 'true'
            // ./gradlew runClient -PquestUiTest -PrunDir=<fresh dir> : the Quests page and a quest toast, screenshots (see QuestUiTour)
            if (project.hasProperty('questUiTest')) property 'livingrealms.questUiTest', 'true'
            // ./gradlew runClient -ParchitectTest -PrunDir=<dir> : Architect view walkthrough with screenshots (see ArchitectTour)
            if (project.hasProperty('architectTest')) property 'livingrealms.architectTest', 'true'
            if (project.hasProperty('tour')) property 'livingrealms.tour', 'true'
            // ./gradlew runClient -PtradeUiTest -PrunDir=<fresh dir> : the Trade page and a caravan on the road (see TradeUiTour)
            if (project.hasProperty('tradeUiTest')) property 'livingrealms.tradeUiTest', 'true'
            // ./gradlew runClient -PwarTour -PvillageExpansion -PpackMods -PrunDir=<fresh dir> : war and siege walkthrough (see WarTour)
            if (project.hasProperty('warTour')) property 'livingrealms.warTour', 'true'
            // ./gradlew runClient -PtownRingTour -PrunDir=<dir> [-PvillageExpansion] : town ring and map claim, before and after a rank-up (see TownRingTour)
            if (project.hasProperty('townRingTour')) property 'livingrealms.townRingTour', 'true'
            // ./gradlew runClient -PcapitalTour -PrunDir=<fresh dir> : a fully grown Capital with walls and castle, screenshots, then left open; -PcapitalTerrain instead builds it on generated hills (see CapitalTour)
            if (project.hasProperty('capitalTour')) property 'livingrealms.capitalTour', 'true'
            if (project.hasProperty('capitalTerrain')) property 'livingrealms.capitalTerrain', 'true'
            // ./gradlew runClient -PcapitalUiTour -PrunDir=<fresh dir> : the same capital with a long queue, the City Manager on every page at several window sizes and GUI scales
            if (project.hasProperty('capitalUiTour')) property 'livingrealms.capitalUiTour', 'true'
        }
        server {
            args '--nogui'
            if (project.hasProperty('cityPlanningTest')) {
                workingDirectory project.file(project.property('cityPlanningTestDir'))
                property 'livingrealms.cityPlanningTest', 'true'
            }
            if (project.hasProperty('warfareTest')) {
                workingDirectory project.file(project.property('warfareTestDir'))
                property 'livingrealms.warfareTest', 'true'
            }
            if (project.hasProperty('compatTest')) {
                workingDirectory project.file(project.property('compatTestDir'))
                property 'livingrealms.compatTest', 'true'
            }
            if (project.hasProperty('villageExpansionTest')) {
                workingDirectory project.file(project.property('villageExpansionTestDir'))
                property 'livingrealms.villageExpansionTest', 'true'
            }
            // ./gradlew runServer -PquestTest -PquestTestDir=<fresh dir> : quest line and town bounties (see QuestSelfTest)
            if (project.hasProperty('questTest')) {
                workingDirectory project.file(project.property('questTestDir'))
                property 'livingrealms.questTest', 'true'
            }
            if (project.hasProperty('chronicleTest')) {
                workingDirectory project.file(project.property('chronicleTestDir'))
                property 'livingrealms.chronicleTest', 'true'
            }
            // ./gradlew runServer -PtradeTest -PtradeTestDir=<fresh dir> : trade routes and caravans (see TradeSelfTest)
            if (project.hasProperty('tradeTest')) {
                workingDirectory project.file(project.property('tradeTestDir'))
                property 'livingrealms.tradeTest', 'true'
            }
            // ./gradlew runServer -PsiegeTest -PsiegeTestDir=<fresh dir> : sieges of walled towns (see SiegeSelfTest, docs/sieges.md)
            if (project.hasProperty('siegeTest')) {
                workingDirectory project.file(project.property('siegeTestDir'))
                property 'livingrealms.siegeTest', 'true'
            }
            if (project.hasProperty('militaryTest')) {
                workingDirectory project.file(project.findProperty('militaryTestDir') ?: 'run-military-test')
                property 'livingrealms.militaryTest', 'true'
            }
        }
    }
}

repositories {
    // Recruits and Workers jars copied from the pack (libs/ is git-ignored)
    flatDir { dirs 'libs', 'libs/pack' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Recruits supplies the soldiers. Its classes are only touched from livingrealms.military.RecruitsBridge.
    compileOnly fg.deobf("blank:recruits:1.15.2")
    runtimeOnly fg.deobf("blank:recruits:1.15.2")
    if (project.hasProperty('integrations')) {
        for (coordinate in ['epicknights:10.15', 'epicknightsaddon:2.6', 'antiquelegacy:1.13', 'architectury:9.2.14', 'clothconfig:11.1.136', 'iceandfire:2.1.13', 'citadel:2.6.3'])
            runtimeOnly fg.deobf('blank:' + coordinate)
    }
    // Village Expansion (village_recruits) owns NPC villages when present. Its classes are only touched from livingrealms.settlement.vx.
    compileOnly fg.deobf("blank:village_recruits:1.0.7.93TC-205")
    if (project.hasProperty('villageExpansion')) {
        runtimeOnly fg.deobf("blank:village_recruits:1.0.7.93TC-205")
        if (!project.hasProperty('workers') && !project.hasProperty('packMods')) runtimeOnly fg.deobf("blank:workers:2.0.3")
    }
    if (project.hasProperty('patchouli')) runtimeOnly fg.deobf('blank:patchouli:1.0')
    if (project.hasProperty('pehkui')) runtimeOnly fg.deobf('blank:pehkui:3.8.2')
    if (project.hasProperty('workers')) runtimeOnly fg.deobf("blank:workers:2.0.3")
    // Pack mods (libs/pack, from the modpack). Only livingrealms.compat touches them; -PpackMods also runs them.
    def packApi = ['vassalsuzerain:1.1.0', 'ranksandtitles:1.2.0', 'recruitsmoraleaddon:1.0.0', 'corpse-forge-1.20.1:1.0.23']
    for (coordinate in packApi) compileOnly fg.deobf('blank:' + coordinate)
    if (project.hasProperty('packMods')) {
        for (coordinate in packApi + ['siegeweapons-1.20.1:0.2.5', 'siege-machines-1.20.1-forge:1.39', 'recruitssiegecompat:2.1.0',
                'smallships-forge-1.20.1:2.0.0-b1.4', 'siegeoverhaul:4.51.11', 'kingdomsieges-forge-1.20.1:1.0.0',
                'stoneycore-forge-1.20.1:1.0.0-rev7', 'commandersvision:1.0-SNAPSHOT',
                'recruitsaddon:1.2.1', 'workers:2.0.3', 'geckolib:4.8.4',
                'architectury:9.2.14', 'clothconfig:11.1.136'])
            runtimeOnly fg.deobf('blank:' + coordinate)
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['Specification-Title': mod_id, 'Specification-Vendor': mod_authors, 'Specification-Version': '1',
                    'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion,
                    'Implementation-Vendor': mod_authors, 'MixinConfigs': 'livingrealms.mixins.json'])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
